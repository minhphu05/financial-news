# =============================================================================
# Fluent Bit Configuration
# Collects JSON-structured logs from all pipeline stages and ships to Loki.
#
# Log layout (host paths, bind-mounted read-only into the container):
#   logs/scraper/    → scraper stage  (tag: scraper.*)
#   logs/pipeline/   → chunking, embedding, upsert, pipeline summary stages
#                      (tag: pipeline.<stage>)
# =============================================================================

[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ---------------------------------------------------------------------------
# INPUT: Scraper JSON logs (one file per scrape run)
# ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               scraper.*
    Path              /var/log/scraper/*.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_scraper.db

# ---------------------------------------------------------------------------
# INPUT: Pipeline stage logs — chunk, embed, upsert, pipeline summary
#        Each stage writes its own file: chunk.json.log, embed.json.log, etc.
# ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               pipeline.chunk
    Path              /var/log/pipeline/chunk.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_pipeline_chunk.db

[INPUT]
    Name              tail
    Tag               pipeline.embed
    Path              /var/log/pipeline/embed.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_pipeline_embed.db

[INPUT]
    Name              tail
    Tag               pipeline.upsert
    Path              /var/log/pipeline/upsert.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_pipeline_upsert.db

[INPUT]
    Name              tail
    Tag               pipeline.clean
    Path              /var/log/pipeline/clean.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_pipeline_clean.db

[INPUT]
    Name              tail
    Tag               pipeline.scrape
    Path              /var/log/pipeline/scrape.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_pipeline_scrape.db

[INPUT]
    Name              tail
    Tag               pipeline.summary
    Path              /var/log/pipeline/pipeline.json.log
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       30
    Skip_Long_Lines   On
    Read_from_Head    Off
    DB                /var/log/flb_pipeline_summary.db

# ---------------------------------------------------------------------------
# FILTER: Enrich scraper logs with hostname and service label
# ---------------------------------------------------------------------------
[FILTER]
    Name   record_modifier
    Match  scraper.*
    Record hostname ${HOSTNAME}
    Record service  scraper

# ---------------------------------------------------------------------------
# FILTER: Enrich pipeline logs with hostname and service label
# ---------------------------------------------------------------------------
[FILTER]
    Name   record_modifier
    Match  pipeline.*
    Record hostname ${HOSTNAME}
    Record service  ingestion-pipeline

# ---------------------------------------------------------------------------
# OUTPUT: Push scraper logs to Loki
# ---------------------------------------------------------------------------
[OUTPUT]
    Name        loki
    Match       scraper.*
    Host        loki
    Port        3100
    Labels      job=scraper, service=scraper
    Label_Keys  $level,$source_name,$ticker_symbol,$keyword
    Auto_Kubernetes_Labels Off
    Line_Format json

# ---------------------------------------------------------------------------
# OUTPUT: Push pipeline stage logs to Loki (chunk / embed / upsert / clean)
# ---------------------------------------------------------------------------
[OUTPUT]
    Name        loki
    Match       pipeline.*
    Host        loki
    Port        3100
    Labels      job=ingestion-pipeline, service=ingestion-pipeline
    Label_Keys  $level,$stage,$run_id
    Auto_Kubernetes_Labels Off
    Line_Format json

