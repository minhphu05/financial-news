# =============================================================================
# Prometheus Configuration
# Scrapes Pushgateway for batch scraper metrics + system metrics via cAdvisor
# and Node Exporter + Fluent Bit internal metrics + RAG API live metrics.
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ---- Prometheus self-monitoring ----------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---- Pushgateway (scraper + ingestion batch metrics) --------------------
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # ---- RAG API (live serving metrics: latency, cache hits, feedback) ------
  - job_name: "rag-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]

  # ---- Fluent Bit internal metrics ----------------------------------------
  - job_name: "fluent-bit"
    metrics_path: "/api/v1/metrics/prometheus"
    static_configs:
      - targets: ["fluent-bit:2020"]

  # ---- cAdvisor (container CPU, RAM, network) -----------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # ---- Node Exporter (host CPU, RAM, disk) --------------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
