# Minimal local infrastructure for scraper development.
#
# Starts only:
# - PostgreSQL for Prefect metadata
# - PostgreSQL for financial metadata
# - Redis used by Prefect messaging
# - Prefect server/services/worker
# - MinIO as a temporary local ADLS substitute

services:
  postgresql-prefect:
    image: postgres:16
    container_name: financial-local-prefect-psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PF_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PF_POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${PF_POSTGRES_DB:-prefectdb}
    ports:
      - "${PF_POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PF_POSTGRES_USER:-prefect} -d ${PF_POSTGRES_DB:-prefectdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [financial-local-net]

  redis-prefect:
    image: redis:7-alpine
    container_name: financial-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    volumes:
      - prefect_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [financial-local-net]

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: financial-local-pf-server
    restart: unless-stopped
    depends_on:
      postgresql-prefect:
        condition: service_healthy
      redis-prefect:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PF_POSTGRES_USER:-prefect}:${PF_POSTGRES_PASSWORD:-prefect}@postgresql-prefect:5432/${PF_POSTGRES_DB:-prefectdb}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:${PREFECT_SERVER_PORT:-4201}/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis-prefect
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "${PREFECT_SERVER_PORT:-4201}:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [financial-local-net]

  prefect-services:
    image: prefecthq/prefect:3-latest
    container_name: financial-local-pf-services
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PF_POSTGRES_USER:-prefect}:${PF_POSTGRES_PASSWORD:-prefect}@postgresql-prefect:5432/${PF_POSTGRES_DB:-prefectdb}
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis-prefect
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start
    networks: [financial-local-net]

  postgresql:
    image: postgres:16
    container_name: financial-local-metadata-psql
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_connections=${METADATA_POSTGRES_MAX_CONNECTIONS:-100}"
    environment:
      POSTGRES_USER: ${METADATA_POSTGRES_USER:-metadata_user}
      POSTGRES_PASSWORD: ${METADATA_POSTGRES_PASSWORD:-metadata_password}
      POSTGRES_DB: ${METADATA_POSTGRES_DB:-financial_metadata}
      POSTGRES_INITDB_ARGS: >-
        -c shared_buffers=${METADATA_POSTGRES_SHARED_BUFFERS:-64MB}
        -c effective_cache_size=${METADATA_POSTGRES_EFFECTIVE_CACHE_SIZE:-256MB}
        -c work_mem=${METADATA_POSTGRES_WORK_MEM:-4MB}
        -c maintenance_work_mem=${METADATA_POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
        -c max_connections=${METADATA_POSTGRES_MAX_CONNECTIONS:-100}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${METADATA_POSTGRES_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - metadata_postgres_data:/var/lib/postgresql/data
      - ./docker/postgresql/init-scripts/001-create-scraper-schema.sql:/docker-entrypoint-initdb.d/001-create-scraper-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_POSTGRES_USER:-metadata_user} -d ${METADATA_POSTGRES_DB:-financial_metadata}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [financial-local-net]

  minio:
    image: minio/minio:latest
    container_name: financial-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks: [financial-local-net]

  # ===========================================================================
  # CDC + Medallion Stack: Postgres WAL -> Debezium -> Redpanda -> Qdrant
  # ===========================================================================
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: financial-local-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "${REDPANDA_EXTERNAL_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
      - "${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      - "${REDPANDA_PANDAPROXY_PORT:-18082}:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092 | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [financial-local-net]

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: financial-local-debezium
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: financial-news-debezium
      CONFIG_STORAGE_TOPIC: financial_news_connect_configs
      OFFSET_STORAGE_TOPIC: financial_news_connect_offsets
      STATUS_STORAGE_TOPIC: financial_news_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
    ports:
      - "${DEBEZIUM_EXTERNAL_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [financial-local-net]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: financial-local-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_EXTERNAL_PORT:-6333}:6333"
      - "${QDRANT_GRPC_EXTERNAL_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [financial-local-net]

  cdc-medallion-worker:
    image: financial-news-cdc-worker:local
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: financial-local-cdc-medallion-worker
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      debezium:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_healthy
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,postgresql,minio,redpanda,debezium,qdrant
      no_proxy: localhost,127.0.0.1,postgresql,minio,redpanda,debezium,qdrant
      METADATA_POSTGRES_HOST_EXTERNAL: postgresql
      METADATA_POSTGRES_EXTERNAL_PORT: 5432
      METADATA_POSTGRES_USER: ${METADATA_POSTGRES_USER:-metadata_user}
      METADATA_POSTGRES_PASSWORD: ${METADATA_POSTGRES_PASSWORD:-metadata_password}
      METADATA_POSTGRES_DB: ${METADATA_POSTGRES_DB:-financial_metadata}
      CONTENT_STORAGE_BACKEND: ${CONTENT_STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-financialnews-datalake}
      MINIO_SECURE: "false"
      MINIO_ROOT_PREFIX: ${MINIO_ROOT_PREFIX:-datascraping}
      ADLS_CONNECTION_STRING: ${ADLS_CONNECTION_STRING:-}
      ADLS_ACCOUNT_NAME: ${ADLS_ACCOUNT_NAME:-}
      ADLS_ACCOUNT_KEY: ${ADLS_ACCOUNT_KEY:-}
      ADLS_FILESYSTEM: ${ADLS_FILESYSTEM:-financialnews-datalake}
      ADLS_ROOT_PREFIX: ${ADLS_ROOT_PREFIX:-datascraping}
      CDC_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CDC_DEBEZIUM_TOPIC: ${CDC_DEBEZIUM_TOPIC:-financial_metadata.core.article_metadata}
      CDC_KAFKA_GROUP_ID: ${CDC_KAFKA_GROUP_ID:-financial-news-cdc-medallion}
      CDC_POLL_TIMEOUT_MS: ${CDC_POLL_TIMEOUT_MS:-1000}
      CDC_MAX_POLL_RECORDS: ${CDC_MAX_POLL_RECORDS:-10}
      CDC_AUTO_OFFSET_RESET: ${CDC_AUTO_OFFSET_RESET:-earliest}
      CDC_CHECKPOINT_TABLE: ${CDC_CHECKPOINT_TABLE:-rag.cdc_file_processing_checkpoints}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-financial_news_chunks}
      QDRANT_EMBEDDING_DIM: ${QDRANT_EMBEDDING_DIM:-1024}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-4-lite}
      VOYAGE_EMBEDDING_DIM: ${VOYAGE_EMBEDDING_DIM:-1024}
      CHUNK_SIZE: ${CHUNK_SIZE:-900}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      CHUNK_MIN_CHUNK_CHARS: ${CHUNK_MIN_CHUNK_CHARS:-80}
    command: python -m src.rag.cdc.worker
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./data:/app/data
    networks: [financial-local-net]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial-local-pgadmin
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      postgresql-prefect:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks: [financial-local-net]

  prefect-worker:
    image: financial-news-prefect-worker:local
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: financial-local-pf-worker
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: localhost,127.0.0.1,prefect-server,prefect-services,postgresql-prefect,postgresql,redis-prefect,minio
      no_proxy: localhost,127.0.0.1,prefect-server,prefect-services,postgresql-prefect,postgresql,redis-prefect,minio
      METADATA_POSTGRES_HOST_EXTERNAL: postgresql
      METADATA_POSTGRES_EXTERNAL_PORT: 5432
      METADATA_POSTGRES_USER: ${METADATA_POSTGRES_USER:-metadata_user}
      METADATA_POSTGRES_PASSWORD: ${METADATA_POSTGRES_PASSWORD:-metadata_password}
      METADATA_POSTGRES_DB: ${METADATA_POSTGRES_DB:-financial_metadata}
      CONTENT_STORAGE_BACKEND: ${CONTENT_STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-financialnews-datalake}
      MINIO_SECURE: "false"
      MINIO_ROOT_PREFIX: ${MINIO_ROOT_PREFIX:-datascraping}
      ADLS_ROOT_PREFIX: ${ADLS_ROOT_PREFIX:-datascraping}
      SCRAPER_BROWSER_ENGINE: ${SCRAPER_BROWSER_ENGINE:-playwright}
      LOGS_DIR: /app/logs/scraper
      PIPELINE_LOG_DIR: /app/logs/pipeline
      PUSHGATEWAY_URL: pushgateway:9091
    command: python -m src.flows.deploy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./data:/app/data
    networks: [financial-local-net]

  # ===========================================================================
  # Observability Stack: Loki + Grafana + Fluent Bit + Prometheus + Pushgateway
  # ===========================================================================
  loki:
    image: grafana/loki:3.1.0
    container_name: financial-local-loki
    restart: unless-stopped
    user: "0"
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_EXTERNAL_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/tmp/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [financial-local-net]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: financial-local-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_METRICS_ENABLED: "true"
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [financial-local-net]

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: financial-local-fluent-bit
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./logs/scraper:/var/log/scraper:ro
      - ./logs/pipeline:/var/log/pipeline:ro
    ports:
      - "${FLUENT_BIT_METRICS_PORT:-2020}:2020"
    networks: [financial-local-net]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: financial-local-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks: [financial-local-net]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: financial-local-pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_EXTERNAL_PORT:-9091}:9091"
    networks: [financial-local-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: financial-local-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_EXTERNAL_PORT:-8080}:8080"
    networks: [financial-local-net]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: financial-local-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "${NODE_EXPORTER_EXTERNAL_PORT:-9100}:9100"
    networks: [financial-local-net]

networks:
  financial-local-net:
    driver: bridge

volumes:
  prefect_postgres_data:
  prefect_redis_data:
  metadata_postgres_data:
  minio_data:
  pgadmin_data:
  loki_data:
  grafana_data:
  prometheus_data:
  redpanda_data:
  qdrant_data:
