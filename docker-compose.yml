# version: "3.9"

# ==============================================================================================================
# Financial News RAG Stack
#
# Services
# -------------------------
# * mongodb       - raw + cleaned article store.
# * pref
# ==============================================================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: financial-news-airflow:2.11.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__DAG_RUN_CONF_OVERRIDES_PARAMS: 'true'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-4}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-airflow-webserver-key}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    AIRFLOW_API_BASE_URL: http://airflow-webserver:8080
    PYTHONPATH: /app:/opt/airflow/dags
    PYSPARK_PYTHON: python3
    SPARK_LOCAL_IP: 127.0.0.1
    NEWS_STORAGE_ENDPOINT: ${NEWS_STORAGE_ENDPOINT:-http://minio:9000}
    NEWS_STORAGE_ACCESS_KEY: ${NEWS_STORAGE_ACCESS_KEY:-minioadmin}
    NEWS_STORAGE_SECRET_KEY: ${NEWS_STORAGE_SECRET_KEY:-minioadmin}
    NEWS_STORAGE_BUCKET: ${NEWS_STORAGE_BUCKET:-financial-news}
    NEWS_SOURCE_FILE: ${NEWS_SOURCE_FILE:-/app/data/raw/cafef_news_raw_final.json}
    NEWS_SOURCE: ${NEWS_SOURCE:-cafef.vn}
    NEWS_PROCESSING_VERSION: ${NEWS_PROCESSING_VERSION:-cafef-v1.1}
    NEWS_SPARK_MASTER: ${NEWS_SPARK_MASTER:-local[2]}
    NEWS_SOURCE_INGESTION_ID: ${NEWS_SOURCE_INGESTION_ID:-}
    NEWS_SILVER_ARTICLES_URI: ${NEWS_SILVER_ARTICLES_URI:-}
    NEWS_SILVER_MENTIONS_URI: ${NEWS_SILVER_MENTIONS_URI:-}
    NEWS_GOLD_RAG_PREFIX: ${NEWS_GOLD_RAG_PREFIX:-}
    NEWS_GOLD_ANALYTICS_PREFIX: ${NEWS_GOLD_ANALYTICS_PREFIX:-}
    NEWS_CHUNK_SIZE: ${NEWS_CHUNK_SIZE:-900}
    NEWS_CHUNK_OVERLAP: ${NEWS_CHUNK_OVERLAP:-120}
    NEWS_EMBEDDING_PROVIDER: ${NEWS_EMBEDDING_PROVIDER:-fastembed}
    NEWS_EMBEDDING_MODEL: ${NEWS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    NEWS_EMBEDDING_DIMENSION: ${NEWS_EMBEDDING_DIMENSION:-384}
    NEWS_MODEL_CACHE_DIR: /opt/news-models
    HF_HOME: /opt/news-models/huggingface
    XDG_CACHE_HOME: /opt/news-models/cache
    NEWS_QDRANT_URL: ${NEWS_QDRANT_URL:-http://qdrant:6333}
    NEWS_QDRANT_COLLECTION: ${NEWS_QDRANT_COLLECTION:-news_chunks_local_v1}
    NEWS_INDEX_BATCH_SIZE: ${NEWS_INDEX_BATCH_SIZE:-32}
    AIRFLOW_NEWS_INDEX_LIMIT: ${AIRFLOW_NEWS_INDEX_LIMIT:-96}
    NEWS_DUCKDB_PATH: /opt/airflow/local/analytics.duckdb
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/plugins:/opt/airflow/plugins:ro
    - ./src:/app/src:ro
    - ./data:/app/data:ro
    - ./tests:/app/tests:ro
    - ./tools:/app/tools:ro
    - airflow_logs:/opt/airflow/logs
    - airflow_spark_ivy:/opt/news-ivy
    - airflow_model_cache:/opt/news-models
    - airflow_duckdb:/opt/airflow/local
  networks: [financial-net]

x-metadata-tools-common: &metadata-tools-common
  build:
    context: .
    dockerfile: docker/metadata-tools/Dockerfile
  image: financial-news-metadata-tools:phase04
  environment: &metadata-tools-env
    METADATA_POSTGRES_HOST: ${METADATA_POSTGRES_HOST:-postgresql}
    METADATA_POSTGRES_INTERNAL_PORT: ${METADATA_POSTGRES_INTERNAL_PORT:-5432}
    METADATA_POSTGRES_DB: ${METADATA_POSTGRES_DB:-financial_metadata}
    METADATA_POSTGRES_USER: ${METADATA_POSTGRES_USER:-metadata_user}
    METADATA_POSTGRES_PASSWORD: ${METADATA_POSTGRES_PASSWORD:-metadata_password}
    METADATA_CDC_USER: ${METADATA_CDC_USER:-metadata_cdc}
    METADATA_CDC_PASSWORD: ${METADATA_CDC_PASSWORD:?Set METADATA_CDC_PASSWORD in .env}
    METADATA_CONTROL_SCHEMA: ${METADATA_CONTROL_SCHEMA:-control_metadata}
    METADATA_CDC_PUBLICATION: ${METADATA_CDC_PUBLICATION:-metadata_cdc_publication}
    METADATA_CDC_SLOT: ${METADATA_CDC_SLOT:-metadata_cdc_slot}
    METADATA_CDC_TOPIC_PREFIX: ${METADATA_CDC_TOPIC_PREFIX:-platform}
    METADATA_CONSUMER_GROUP: ${METADATA_CONSUMER_GROUP:-metadata-inspector}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    DEBEZIUM_CONNECT_URL: ${DEBEZIUM_CONNECT_URL:-http://debezium:8083}
    DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:-metadata-control-plane}
    METADATA_MIGRATIONS_DIR: /app/metadata/migrations
  volumes:
    - ./src:/app/src:ro
    - ./metadata:/app/metadata:ro
    - ./tests:/app/tests:ro
    - ./artifacts:/app/artifacts
  networks: [financial-net]

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${NEWS_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${NEWS_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '${NEWS_MINIO_PORT:-9000}:9000'
      - '${NEWS_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - news_minio_data:/data
    networks: [financial-net]

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [financial-net]

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Local}
      _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-airflow@example.local}
      _AIRFLOW_WWW_USER_ROLE: Admin
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - '${AIRFLOW_WEB_PORT:-8088}:8080'
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-cli:
    <<: *airflow-common
    profiles: [airflow-cli]
    entrypoint: []
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: bash

  news-pipeline:
    profiles: [local-pipeline]
    build:
      context: .
      dockerfile: docker/news-pipeline/Dockerfile
    working_dir: /app
    environment:
      PYTHONPATH: /app
      PYSPARK_PYTHON: python3
      SPARK_LOCAL_IP: 127.0.0.1
      NEWS_STORAGE_ENDPOINT: ${NEWS_STORAGE_ENDPOINT:-http://minio:9000}
      NEWS_STORAGE_ACCESS_KEY: ${NEWS_STORAGE_ACCESS_KEY:-minioadmin}
      NEWS_STORAGE_SECRET_KEY: ${NEWS_STORAGE_SECRET_KEY:-minioadmin}
      NEWS_STORAGE_BUCKET: ${NEWS_STORAGE_BUCKET:-financial-news}
      NEWS_SOURCE_FILE: ${NEWS_SOURCE_FILE:-/app/data/raw/cafef_news_raw_final.json}
      NEWS_PROCESSING_VERSION: ${NEWS_PROCESSING_VERSION:-cafef-v1.1}
      NEWS_SPARK_MASTER: ${NEWS_SPARK_MASTER:-local[2]}
      NEWS_SOURCE_INGESTION_ID: ${NEWS_SOURCE_INGESTION_ID:-}
      NEWS_SILVER_ARTICLES_URI: ${NEWS_SILVER_ARTICLES_URI:-}
      NEWS_SILVER_MENTIONS_URI: ${NEWS_SILVER_MENTIONS_URI:-}
      NEWS_GOLD_RAG_PREFIX: ${NEWS_GOLD_RAG_PREFIX:-}
      NEWS_GOLD_ANALYTICS_PREFIX: ${NEWS_GOLD_ANALYTICS_PREFIX:-}
      NEWS_CHUNK_SIZE: ${NEWS_CHUNK_SIZE:-900}
      NEWS_CHUNK_OVERLAP: ${NEWS_CHUNK_OVERLAP:-120}
      NEWS_EMBEDDING_PROVIDER: ${NEWS_EMBEDDING_PROVIDER:-fastembed}
      NEWS_EMBEDDING_MODEL: ${NEWS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      NEWS_EMBEDDING_DIMENSION: ${NEWS_EMBEDDING_DIMENSION:-384}
      NEWS_MODEL_CACHE_DIR: /opt/news-models
      HF_HOME: /opt/news-models/huggingface
      XDG_CACHE_HOME: /opt/news-models/cache
      NEWS_QDRANT_URL: ${NEWS_QDRANT_URL:-http://qdrant:6333}
      NEWS_QDRANT_COLLECTION: ${NEWS_QDRANT_COLLECTION:-news_chunks_local_v1}
      NEWS_INDEX_LIMIT: ${NEWS_INDEX_LIMIT:-0}
      NEWS_INDEX_BATCH_SIZE: ${NEWS_INDEX_BATCH_SIZE:-32}
      NEWS_DUCKDB_PATH: ${NEWS_DUCKDB_PATH:-/app/local/analytics.duckdb}
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./tests:/app/tests:ro
      - ./data/local:/app/local
      - news_spark_ivy:/opt/news-ivy
      - news_model_cache:/opt/news-models
    depends_on:
      - minio
    networks: [financial-net]

  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi8
    container_name: financial-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    ports:
      - "27018:27017"   
    networks: [financial-net]

  postgresql-prefect:
    image: postgres:14
    container_name: financial-prefect-psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PF_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PF_POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${PF_POSTGRES_DB:-prefectdb}
    ports:
      - "${PF_POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PF_POSTGRES_USER:-prefect} -d ${PF_POSTGRES_DB:-prefectdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [financial-net]
  
  redis-prefect:
    image: redis:7
    container_name: financial-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [financial-net]

  mlflow:
    build:
      context: ./docker/mlflow
    container_name: financial-mlflow
    restart: unless-stopped
    ports:
      - "5555:5000"
    volumes:
      - mlflow_store:/mlflow/store
      - mlflow_artifacts:/mlflow/artifacts
    networks: [financial-net]

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: financial-pf-server
    restart: unless-stopped
    depends_on:
      postgresql-prefect:
        condition: service_healthy
      redis-prefect:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PF_POSTGRES_USER}:${PF_POSTGRES_PASSWORD}@postgresql-prefect:5432/${PF_POSTGRES_DB}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis-prefect
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [financial-net]
  
  prefect-services:
    image: prefecthq/prefect:3-latest
    container_name: financial-pf-services
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PF_POSTGRES_USER}:${PF_POSTGRES_PASSWORD}@postgresql-prefect:5432/${PF_POSTGRES_DB}
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis-prefect
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start
    networks: [financial-net]

  prefect-worker:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: financial-pf-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      prefect-server:
        condition: service_healthy
    command: python -m src.flows.deploy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/?authSource=admin
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgresql-prefect
      CACHE_REDIS_URL: redis://redis-prefect:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      METADATA_POSTGRES_HOST_EXTERNAL: postgresql
      METADATA_POSTGRES_EXTERNAL_PORT: 5432
      PIPELINE_LOG_DIR: /app/logs/pipeline
    volumes:
      - ./logs/pipeline:/app/logs/pipeline
      - ./data:/app/data
    networks: [financial-net]
  
  postgresql:
    build:
      context: ./docker/postgresql
    container_name: financial-metadata-psql
    restart: unless-stopped
    environment:
      # PostgreSQL superuser credentials
      POSTGRES_USER: ${METADATA_POSTGRES_USER:-metadata_user}
      POSTGRES_PASSWORD: ${METADATA_POSTGRES_PASSWORD:-metadata_password}
      POSTGRES_DB: ${METADATA_POSTGRES_DB:-financial_metadata}
      
      # Performance tuning parameters
      POSTGRES_INITDB_ARGS: >-
        -c shared_buffers=${METADATA_POSTGRES_SHARED_BUFFERS:-64MB}
        -c effective_cache_size=${METADATA_POSTGRES_EFFECTIVE_CACHE_SIZE:-256MB}
        -c work_mem=${METADATA_POSTGRES_WORK_MEM:-4MB}
        -c maintenance_work_mem=${METADATA_POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
        -c max_connections=${METADATA_POSTGRES_MAX_CONNECTIONS:-100}
      
      # Additional PostgreSQL configuration
      POSTGRES_HOST_AUTH_METHOD: md5

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=${METADATA_POSTGRES_MAX_REPLICATION_SLOTS:-10}
      - -c
      - max_wal_senders=${METADATA_POSTGRES_MAX_WAL_SENDERS:-10}
      - -c
      - max_slot_wal_keep_size=${METADATA_POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-1GB}
    
    ports:
      - "${METADATA_POSTGRES_EXTERNAL_PORT:-5434}:${METADATA_POSTGRES_INTERNAL_PORT:-5432}"
    
    volumes:
      # Persistent data volume
      - ${METADATA_POSTGRES_DATA_VOLUME:-metadata_postgres_data}:/var/lib/postgresql/data
      
      # Custom initialization scripts (optional)
      # - ./docker/postgresql/init-scripts:/docker-entrypoint-initdb.d:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_POSTGRES_USER:-metadata_user} -d ${METADATA_POSTGRES_DB:-financial_metadata}"]
      interval: ${HEALTH_CHECK_INTERVAL:-10}s
      timeout: ${HEALTH_CHECK_TIMEOUT:-5}s
      retries: ${HEALTH_CHECK_RETRIES:-5}
      start_period: ${HEALTH_CHECK_START_PERIOD:-10}s
    
    networks: [financial-net]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks: [financial-net]

  debezium:
    image: quay.io/debezium/connect:3.3.2.Final
    restart: unless-stopped
    ports:
      - "${DEBEZIUM_CONNECT_EXTERNAL_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: metadata-connect
      CONFIG_STORAGE_TOPIC: metadata.connect.configs
      OFFSET_STORAGE_TOPIC: metadata.connect.offsets
      STATUS_STORAGE_TOPIC: metadata.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      REST_ADVERTISED_HOST_NAME: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [financial-net]

  metadata-tools:
    <<: *metadata-tools-common
    profiles: [metadata-tools]
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ===========================================================================
  # Observability Stack: Loki + Grafana + Fluent Bit + Prometheus + Pushgateway
  # ===========================================================================
  loki:
    image: grafana/loki:3.1.0
    container_name: financial-loki
    restart: unless-stopped
    user: "0"
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_EXTERNAL_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/tmp/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [financial-net]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: financial-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [financial-net]

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: financial-fluent-bit
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./logs/scraper:/var/log/scraper:ro
      - ./logs/pipeline:/var/log/pipeline:ro
    ports:
      - "${FLUENT_BIT_METRICS_PORT:-2020}:2020"
    networks: [financial-net]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: financial-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks: [financial-net]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: financial-pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_EXTERNAL_PORT:-9091}:9091"
    networks: [financial-net]

  # ---- Container & Host Metrics (cAdvisor + Node Exporter) ----------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: financial-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks: [financial-net]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: financial-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    networks: [financial-net]

  qdrant:
    image: qdrant/qdrant:v1.13.1
    container_name: financial-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_EXTERNAL_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [financial-net]

  # ===========================================================================
  # Application: FastAPI backend + React frontend
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: financial-api
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/?authSource=admin
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CACHE_REDIS_URL: redis://redis-prefect:6379/1
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PIPELINE_LOG_DIR: /app/logs/pipeline
    volumes:
      - ./logs/pipeline:/app/logs/pipeline
    ports:
      - "${API_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [financial-net]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: financial-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3002}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [financial-net]

networks:
  financial-net:
    driver: bridge

volumes:
  news_minio_data:
    driver: local
  news_spark_ivy:
    driver: local
  news_model_cache:
    driver: local
  airflow_postgres_data:
    driver: local
  airflow_logs:
    driver: local
  airflow_spark_ivy:
    driver: local
  airflow_model_cache:
    driver: local
  airflow_duckdb:
    driver: local
  mongo_data:
    driver: local
  postgres_data:
    driver: local
  metadata_postgres_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  mlflow_store:
    driver: local
  mlflow_artifacts:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  qdrant_data:
    driver: local
