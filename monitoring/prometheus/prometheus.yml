global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local
    platform: financial-news

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: pipeline-exporter
    static_configs:
      - targets: [platform-metrics-exporter:9108]

  - job_name: postgresql
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: airflow-statsd
    static_configs:
      - targets: [airflow-statsd-exporter:9102]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: [qdrant:6333]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
