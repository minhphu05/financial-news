groups:
  - name: financial-news-services
    rules:
      - alert: ServiceDown
        expr: up{job=~"pipeline-exporter|postgresql|kafka|airflow-statsd|minio|qdrant"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "Required local service metrics target is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."

      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "Qdrant is unavailable"
          description: "The derived semantic serving index cannot be reached."

      - alert: DebeziumConnectorDown
        expr: financial_news_debezium_connector_up == 0 or financial_news_debezium_task_up == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "Metadata CDC connector or task is not running"
          description: "Kafka and PostgreSQL have separate health series for diagnosis."

      - alert: KafkaConsumerLagHigh
        expr: max(kafka_consumergroup_lag{consumergroup=~"metadata-.*|phase07-.*"}) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Local metadata CDC consumer lag exceeds the demo threshold"
          description: "The 100-message threshold is configurable guidance, not a production SLA."

  - name: financial-news-pipeline
    rules:
      - alert: PipelineRunFailed
        expr: time() - financial_news_pipeline_last_run_timestamp_seconds{status="FAILED"} < 600
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "A financial-news pipeline run failed"
          description: "The failure is recorded in Phase 05 operational metadata."

      - alert: PipelineNoSuccessfulRunRecently
        expr: time() - max by (pipeline, source) (financial_news_pipeline_last_run_timestamp_seconds{status="SUCCESS"}) > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No successful pipeline run in 48 hours"
          description: "The local threshold is a development default, not a production SLA."

      - alert: SilverDataStale
        expr: financial_news_data_freshness_seconds{layer="silver"} > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Silver operational freshness exceeds 48 hours"

      - alert: GoldDataStale
        expr: financial_news_data_freshness_seconds{layer=~"gold_rag|gold_analytics"} > 172800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gold operational freshness exceeds 48 hours"

      - alert: QdrantIndexFailure
        expr: time() - financial_news_pipeline_stage_last_attempt_timestamp_seconds{stage="qdrant_upsert",status="FAILED"} < 600
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "A Qdrant indexing stage failed"

      - alert: DataQualityGateFailed
        expr: financial_news_data_quality_gate_pass == 0 or financial_news_data_quality_invalid_records > 0
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Latest source validation or Silver quality observation needs attention"

      - alert: ReconciliationFailed
        expr: financial_news_reconciliation_pass == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Latest durable-to-serving reconciliation did not pass"

      - alert: PostgreSQLReplicationSlotInactive
        expr: financial_news_cdc_replication_slot_active == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Metadata CDC logical replication slot is inactive"
